services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny}
      POSTGRES_DB: lenny
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false          # works with zero configuration; .env only overrides defaults
    environment:
      DATABASE_URL: postgresql+psycopg://lenny:${POSTGRES_PASSWORD:-lenny}@db:5432/lenny
    ports:
      - "8000:8000"
    volumes:
      - kbdata:/app/data         # cloned transcripts persist across restarts
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama running on the host (Linux too)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  kbdata:
